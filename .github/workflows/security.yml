name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 1. dependency-review : signale les dépendances vulnérables ajoutées par une PR
#    (nécessite le Dependency Graph activé dans les réglages du dépôt).
# 2. secret-scan : gitleaks sur tout l'historique et les nouveaux commits.
permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
